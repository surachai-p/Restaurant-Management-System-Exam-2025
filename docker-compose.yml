version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://neondb_owner:npg_hvzdXR5DFKx7@ep-spring-firefly-bdbuq6wf-pooler.c-8.us-east-2.aws.neon.tech/neondb?sslmode=require
      - JWT_SECRET=RMS_Super_Secret_Key_2025
      - CORS_ORIGIN=http://localhost:80
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      backend:
        condition: service_healthy