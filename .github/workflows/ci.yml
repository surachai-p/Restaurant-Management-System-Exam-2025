name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      - name: Run backend tests
        continue-on-error: true
        run: cd backend && npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rms_test

      - name: Setup Database & Seed
        run: |
          cd backend
          npx prisma db push --accept-data-loss
          npx prisma db seed || true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rms_test

      - name: Start Backend Server
        run: |
          cd backend
          npm run build || true
          nohup npm start > backend.log 2>&1 &
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/health > /dev/null || curl -s http://localhost:4000/api/health > /dev/null || curl -s http://localhost:5000/api/health > /dev/null; then
              echo "Backend is ready!"
              break
            fi
            sleep 2
          done
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rms_test
          JWT_SECRET: ci-test-secret-key-2025
          CORS_ORIGIN: "*"

      - name: Install and Run Newman API Tests
        run: |
          npm install -g newman
          COLLECTION=$(find tests/postman -name "*.json" | head -n 1)
          echo "Running Newman collection: $COLLECTION"
          newman run "$COLLECTION" --env-var "baseUrl=http://localhost:3000" --env-var "base_url=http://localhost:3000"

      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend build
        run: cd frontend && npm run build