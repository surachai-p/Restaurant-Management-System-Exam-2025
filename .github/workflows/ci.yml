name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Backend Unit Tests (Vitest)
        run: |
          cd backend
          npm test

      - name: Security Audit (Backend & Frontend)
        run: |
          cd backend && npm audit --audit-level=high || true
          cd frontend && npm audit --audit-level=high || true

      - name: Run Newman API Tests
        run: |
          npm install -g newman
          npx newman run tests/postman/RMS-68030434-TestSuite.json -e tests/postman/env.json --suppress-exit-code 0