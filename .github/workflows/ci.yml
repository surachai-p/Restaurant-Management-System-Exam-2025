name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-security:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Security Audit - Backend
        run: cd backend && npm audit --audit-level=high

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      - name: Run Vitest (Unit & API Tests)
        run: cd backend && npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rms_test
          JWT_SECRET: ci-test-secret-key

      - name: Setup Database & Run Newman E2E Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rms_test
          JWT_SECRET: ci-test-secret-key
          PORT: 3001
          CORS_ORIGIN: http://localhost:5173
        run: |
          cd backend
          npx prisma db push
          npx tsx prisma/seed.ts
          npx tsx prisma/seed-test.ts
          npm run build
          npm start &
          sleep 4
          cd ..
          npm install -g newman
          newman run tests/postman/RMS-TestSuite-v2.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Security Audit - Frontend
        run: cd frontend && npm audit --audit-level=high

      - name: Build frontend
        run: cd frontend && npm run build
