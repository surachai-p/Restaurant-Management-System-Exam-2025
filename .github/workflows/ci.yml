name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'backend/package-lock.json'

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Generate Prisma client
      run: cd backend && npx prisma generate

    - name: Run backend tests
      run: cd backend && npm test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rms_test

    - name: Setup Node.js for frontend
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install frontend dependencies
      run: cd frontend && npm ci

    - name: Run frontend build
      run: cd frontend && npm run build

  security-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: npm audit — backend (fail on high or worse)
      run: |
        cd backend
        npm ci
        npm audit --audit-level=high

    - name: npm audit — frontend (fail on critical only; documented dev-only moderate/high findings)
      run: |
        cd frontend
        npm ci
        npm audit --audit-level=critical

  e2e-newman:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rms_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'backend/package-lock.json'

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Initialize database schema and seed
      run: cd backend && npx prisma db push && npx tsx prisma/seed.ts
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rms_db
        JWT_SECRET: ci-e2e-secret-not-for-production

    - name: Start backend API
      run: |
        cd backend
        npm run build
        export NODE_ENV=production
        export PORT=3001
        export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rms_db
        export JWT_SECRET=ci-e2e-secret-not-for-production
        export CORS_ORIGIN=http://localhost:8080
        nohup node dist/app.js > server.log 2>&1 &
        for i in $(seq 1 30); do
          curl -sf http://localhost:3001/api/health && break
          sleep 1
        done

    - name: Run Newman E2E tests
      run: |
        npm install -g newman
        newman run tests/postman/RMS-TestSuite-v2.json \
          -e tests/postman/env-ci.json \
          --reporters cli,json \
          --reporter-json-export tests/reports/newman-report.json

    - name: Upload Newman report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: newman-report
        path: tests/reports/newman-report.json
