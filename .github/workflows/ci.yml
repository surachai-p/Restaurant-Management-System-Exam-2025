name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'backend/package-lock.json'

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Generate Prisma client
      run: cd backend && npx prisma generate

    - name: Run backend tests
      continue-on-error: true
      run: cd backend && npm test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rms_test
        DIRECT_URL: postgresql://postgres:postgres@localhost:5432/rms_test
        JWT_SECRET: test-secret-key-for-ci

    - name: Setup Node.js for frontend
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install frontend dependencies
      run: cd frontend && npm ci

    - name: Run frontend build
      run: cd frontend && npm run build

    - name: Install Newman and HTML reporter
      run: npm install -g newman newman-reporter-htmlextra

    - name: Setup DB, Start Backend & Run Newman E2E Tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rms_test
        DIRECT_URL: postgresql://postgres:postgres@localhost:5432/rms_test
        JWT_SECRET: test-secret-key-for-ci
        PORT: 3001
      run: |
        cd backend
        npx prisma db push --accept-data-loss
        npx prisma db seed || true
        npm run dev > ../backend.log 2>&1 &
        SERVER_PID=$!
        cd ..

        echo "⏳ Waiting for Backend API to start..."
        for i in {1..15}; do
          if curl -s http://localhost:3001/api/health | grep -q "ok"; then
            echo "✅ Backend API is ready!"
            break
          fi
          sleep 2
        done

        mkdir -p tests/reports
        newman run tests/postman/RMS-68030223-TestSuite.json \
          --env-var "base_url=http://localhost:3001/api" \
          --reporters cli,htmlextra,json \
          --reporter-htmlextra-export tests/reports/newman-report.html \
          --reporter-json-export tests/reports/newman-report.json \
          --color on || true

        if [ -f tests/reports/newman-report.json ]; then
          TOTAL=$(jq '.run.stats.assertions.total' tests/reports/newman-report.json)
          FAILED=$(jq '.run.stats.assertions.failed' tests/reports/newman-report.json)
          PASSED=$((TOTAL - FAILED))
          RATE=$(awk "BEGIN {printf \"%.2f\", ($PASSED / $TOTAL) * 100}")
          echo "📊 Newman Pass Rate: $PASSED / $TOTAL ($RATE%)"
        fi

        kill $SERVER_PID || true

    - name: Upload Newman Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: newman-ci-reports
        path: tests/reports/