name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    # Setup Node.js for Backend
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'backend/package-lock.json'

    # Backend - Install and Generate Prisma
    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Generate Prisma client
      run: cd backend && npx prisma generate

    # Backend - Run Unit Tests
    - name: Run backend unit tests
      run: cd backend && npm test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rms_test

    # Frontend - Setup and Build
    - name: Setup Node.js for frontend
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install frontend dependencies
      run: cd frontend && npm ci

    - name: Run frontend build
      run: cd frontend && npm run build

    # Security - npm audit
    - name: Security audit - Backend
      run: cd backend && npm audit --audit-level=high || true

    - name: Security audit - Frontend
      run: cd frontend && npm audit --audit-level=high || true

    # Newman E2E Tests
    - name: Install Newman globally
      run: npm install -g newman

    - name: Run Newman E2E tests
      run: |
        newman run tests/postman/RMS-TestSuite-v2.json \
          -e tests/postman/env-ci.json \
          --reporters cli,json \
          --reporter-json-export newman-report.json
      continue-on-error: true

    # Upload artifacts
    - name: Upload Newman report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: newman-report
        path: newman-report.json
