
name: RMS CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-build:
    name: Build, Test and Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_app
      JWT_SECRET: rms-ci-testing-only-secret-not-for-production
      PORT: "3001"
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173

    steps:
      # STEP 1: Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # STEP 2: Node.js
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # STEP 3: Backend dependencies
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # STEP 4: Prisma
      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      # STEP 5: Build backend
      - name: Build backend
        working-directory: backend
        run: npm run build

      # STEP 6: Vitest
      - name: Run backend unit tests
        working-directory: backend
        run: npm test

      # STEP 7: Frontend dependencies
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # STEP 8: Build frontend
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # STEP 9: Backend Security Audit
      - name: Backend security audit
        id: backend_audit
        continue-on-error: true
        working-directory: backend
        run: |
          mkdir -p ../tests/reports
          npm audit --audit-level=high --json > ../tests/reports/backend-audit-ci.json

      # STEP 10: Frontend Security Audit
      - name: Frontend security audit
        id: frontend_audit
        continue-on-error: true
        working-directory: frontend
        run: |
          mkdir -p ../tests/reports
          npm audit --audit-level=high --json > ../tests/reports/frontend-audit-ci.json

      # STEP 11: Security Audit Summary
      - name: Security audit summary
        if: always()
        run: |
          echo "## Security Audit Results" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend: ${{ steps.backend_audit.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: ${{ steps.frontend_audit.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Audit failures must be reviewed; they are not security passes." >> "$GITHUB_STEP_SUMMARY"

      # STEP 12: Prepare Database
      - name: Prepare PostgreSQL database
        working-directory: backend
        run: |
          npx prisma db push
          npx tsx prisma/seed.ts

      # STEP 13: Install Newman
      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      # STEP 14: Start Backend and Run Newman
      - name: Start Backend and Run Newman E2E Tests
        env:
          NODE_ENV: development
        run: |
          mkdir -p tests/reports

          cd backend
          node dist/app.js > /tmp/rms-backend.log 2>&1 &
          SERVER_PID=$!
          cd ..

          echo "Waiting for RMS Backend..."

          READY=0

          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3001/api/health > /dev/null; then
              echo "Backend is ready"
              READY=1
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Backend process exited unexpectedly"
              break
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Backend failed to start"
            cat /tmp/rms-backend.log
            exit 1
          fi

          echo "Running 21 Newman Test Cases..."

          newman run tests/postman/RMS-TestSuite-final.json \
            --environment tests/postman/env-debug.json \
            --env-var "base_url=http://localhost:3001/api" \
            --reporters cli,json,htmlextra \
            --reporter-json-export tests/reports/newman-result.json \
            --reporter-htmlextra-export tests/reports/newman-report.html

      # STEP 15: Upload Reports
      - name: Upload testing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rms-test-reports
          path: |
            tests/reports/newman-result.json
            tests/reports/newman-report.html
            tests/reports/backend-audit-ci.json
            tests/reports/frontend-audit-ci.json
          if-no-files-found: warn
